name: CI/CD Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: portfolio-backend-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Thinkpad Server
    needs: build
    if: github.repository_owner == 'mrfroglab'
    runs-on: self-hosted
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy with Docker Compose
        run: |
          COMPOSE=/opt/stacks/apps/portfolio/docker-compose.yml
          docker compose -f "$COMPOSE" pull backend
          # --no-deps: never touch the database container.
          # The image runs `prisma migrate deploy` on start, so migrations apply here.
          docker compose -f "$COMPOSE" up -d --no-deps backend
          docker image prune -f
      - name: Verify container is up
        run: |
          sleep 20
          state=$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' portfolio-api)
          echo "portfolio-api state (running restarts): $state"
          if [ "$state" != "true 0" ]; then
            echo "portfolio-api is not healthy. Check: docker logs portfolio-api" >&2
            exit 1
          fi
          # The app must answer on 3001, the port Caddy proxies to (a wrong PORT keeps the container "up" but gives 502).
          docker exec portfolio-api node -e "require('http').get('http://localhost:3001/api/projects',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" \
            || { echo "portfolio-api is not answering on :3001. Check: docker logs portfolio-api" >&2; exit 1; }
          echo "portfolio-api answers on :3001"
